# /etc/nginx/sites-available/family.sudoservers.com.conf
#
# Layout assumption (matches the Astro `node` adapter in 'standalone' mode):
#   - Static client files live at /config/www/family.sudoservers.com/client/
#     (this is the `dist/client/` output from `astro build`)
#   - Node server runs in the `family-api` container on the shared `swag`
#     docker network, serving `dist/server/entry.mjs` on port 4321
#     (see deploy/docker-compose.yml).
#   - TLS is handled by /config/nginx/ssl.conf

# ── Rate-limit the submissions API ──────────────────────────────────────────
# 5 requests/minute per source IP. Burst of 3 so legitimate quick retries
# (form validation pass) don't trip it.
limit_req_zone $binary_remote_addr zone=submissions:10m rate=5r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name family.sudoservers.com;

    include /config/nginx/ssl.conf;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The Google Identity Services button needs to load from accounts.google.com.
    # Permissive but explicit CSP for that flow + the genealogy data.
    # Single line: nginx doesn't honor backslash-newline continuation inside
    # directive values, so multi-line versions break the CSP parse.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; font-src 'self' data:;" always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # If you build brotli into nginx, this is the spot:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types application/javascript application/json image/svg+xml text/css text/plain;

    # ── Static root ──────────────────────────────────────────────────────────
    root /config/www/family.sudoservers.com/client;
    index index.html;

    # Don't leak server version
    server_tokens off;

    # ── Submissions API → Node ───────────────────────────────────────────────
    # Anything under /api/ goes to the Node server; the Astro build creates
    # SSR endpoints there for sign-in and corrections.
    location /api/ {
        limit_req zone=submissions burst=3 nodelay;

        # Resolves over the shared `swag` docker network — rename if your
        # compose project uses a different network name. The container is
        # defined in deploy/docker-compose.yml.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $api_upstream http://family-api:4321;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Hashed Astro assets — cache forever ──────────────────────────────────
    # Astro writes content-hashed filenames into /_assets/, so they're safe to
    # cache aggressively. Same for /_astro/.
    location ~* ^/(_assets|_astro)/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Data JSON — short cache, etag-validated ──────────────────────────────
    # The genealogy data isn't hashed (it's regenerated on each build), so we
    # want browsers to revalidate cheaply but not refetch the whole 800kb
    # tree-full.json every page load. 5min serves the typical browsing
    # session; etag handles staleness.
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        etag on;
        try_files $uri =404;
    }

    # ── Everything else — the static site, with SPA-style fallback ───────────
    # Astro 'hybrid' mode prerenders HTML for every page, so try_files finds
    # them directly. The fallback to /index.html keeps client-side routing
    # working if you ever add it.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── Quiet noise ──────────────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Block hidden files (.git, .env, .htaccess, etc.) just in case
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /config/log/nginx/family.sudoservers.com.access.log;
    error_log  /config/log/nginx/family.sudoservers.com.error.log warn;
}

# ── Deploy notes ─────────────────────────────────────────────────────────────
#
# 1. The Node server runs as a container alongside SWAG. See
#    deploy/docker-compose.yml. Bring it up with:
#      docker compose -f deploy/docker-compose.yml up -d --build
#
# 2. Each deploy from a workstation / CI:
#      cd web
#      npm ci --omit=dev
#      npm run build
#      rsync -a --delete dist/client/      <host>:/config/www/family.sudoservers.com/client/
#      rsync -a --delete dist/server/      <host>:/config/www/family.sudoservers.com/server/
#      rsync -a --delete node_modules/     <host>:/config/www/family.sudoservers.com/node_modules/
#      rsync -a package.json package-lock.json <host>:/config/www/family.sudoservers.com/
#      ssh <host> 'docker compose restart family-api'
#    SWAG serves the new client files immediately; the API container
#    picks up the new server bundle on restart (bind-mounted).
#
# 3. /etc/family-sudoservers/env should be 0640 root:root and contain:
#      GOOGLE_CLIENT_ID=...
#      GITHUB_TOKEN=...
#      GITHUB_REPO=willdeberry/family.sudoservers.com
