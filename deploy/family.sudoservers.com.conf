# /etc/nginx/sites-available/family.sudoservers.com.conf
#
# Layout assumption (matches the Astro `node` adapter in 'standalone' mode):
#   - The `family-api` container serves everything (static + SSR) on port 4321.
#     All traffic is proxied through; nginx handles TLS, compression, and
#     cache headers by location pattern.
#   - TLS is handled by /config/nginx/ssl.conf

# ── Rate-limit the submissions API ──────────────────────────────────────────
# 5 requests/minute per source IP. Burst of 3 so legitimate quick retries
# (form validation pass) don't trip it.
limit_req_zone $binary_remote_addr zone=submissions:10m rate=5r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name family.sudoservers.com;

    include /config/nginx/ssl.conf;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The Google Identity Services button needs to load from accounts.google.com.
    # Permissive but explicit CSP for that flow + the genealogy data.
    # Single line: nginx doesn't honor backslash-newline continuation inside
    # directive values, so multi-line versions break the CSP parse.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; font-src 'self' data:;" always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # If you build brotli into nginx, this is the spot:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types application/javascript application/json image/svg+xml text/css text/plain;

    # Don't leak server version
    server_tokens off;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream http://family-api:4321;

    # ── Submissions API — rate limited ───────────────────────────────────────
    location /api/ {
        limit_req zone=submissions burst=3 nodelay;

        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Hashed Astro assets — cache forever ──────────────────────────────────
    location ~* ^/(_assets|_astro)/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass $upstream;
    }

    # ── Data JSON — short cache ───────────────────────────────────────────────
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass $upstream;
    }

    # ── Everything else → Node container ─────────────────────────────────────
    location / {
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # ── Quiet noise ──────────────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; proxy_pass $upstream; }
    location = /robots.txt  { access_log off; log_not_found off; proxy_pass $upstream; }

    # Block hidden files (.git, .env, .htaccess, etc.) just in case
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /config/log/nginx/family.sudoservers.com.access.log;
    error_log  /config/log/nginx/family.sudoservers.com.error.log warn;
}

