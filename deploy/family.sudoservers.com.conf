# /etc/nginx/sites-available/family.sudoservers.com.conf
#
# Layout assumption (matches the Astro `node` adapter in 'middleware' or
# 'standalone' mode):
#   - Static client files live at /var/www/family.sudoservers.com/client/
#     (this is the `dist/client/` output from `astro build`)
#   - Node server runs on 127.0.0.1:4321 serving `dist/server/entry.mjs`
#     (start it with a systemd unit; see notes at the bottom of this file)
#   - TLS cert from certbot at /etc/letsencrypt/live/family.sudoservers.com/
#
# Two server blocks: port 80 for ACME challenge + HTTPS redirect, port 443
# for the live site.

# ── Rate-limit the submissions API ──────────────────────────────────────────
# 5 requests/minute per source IP. Burst of 3 so legitimate quick retries
# (form validation pass) don't trip it.
limit_req_zone $binary_remote_addr zone=submissions:10m rate=5r/m;

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name family.sudoservers.com;

    # Let certbot renew via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name family.sudoservers.com;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/family.sudoservers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.sudoservers.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # HSTS — only enable after you're sure HTTPS is rock-solid (cert auto-renews etc.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The Google Identity Services button needs to load from accounts.google.com.
    # Permissive but explicit CSP for that flow + the genealogy data.
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self' 'unsafe-inline' https://accounts.google.com; \
        style-src 'self' 'unsafe-inline' https://accounts.google.com; \
        img-src 'self' data: https://*.googleusercontent.com; \
        connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; \
        frame-src https://accounts.google.com; \
        font-src 'self' data:;" always;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # If you build brotli into nginx, this is the spot:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types application/javascript application/json image/svg+xml text/css text/plain;

    # ── Static root ──────────────────────────────────────────────────────────
    root /var/www/family.sudoservers.com/client;
    index index.html;

    # Don't leak server version
    server_tokens off;

    # ── Submissions API → Node ───────────────────────────────────────────────
    # Anything under /api/ goes to the Node server; the Astro build creates
    # SSR endpoints there for sign-in and corrections.
    location /api/ {
        limit_req zone=submissions burst=3 nodelay;

        proxy_pass         http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ── Hashed Astro assets — cache forever ──────────────────────────────────
    # Astro writes content-hashed filenames into /_assets/, so they're safe to
    # cache aggressively. Same for /_astro/.
    location ~* ^/(_assets|_astro)/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Data JSON — short cache, etag-validated ──────────────────────────────
    # The genealogy data isn't hashed (it's regenerated on each build), so we
    # want browsers to revalidate cheaply but not refetch the whole 800kb
    # tree-full.json every page load. 5min serves the typical browsing
    # session; etag handles staleness.
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        etag on;
        try_files $uri =404;
    }

    # ── PDFs — large, immutable scans (if you ever serve them) ───────────────
    location /pdfs/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── Everything else — the static site, with SPA-style fallback ───────────
    # Astro 'hybrid' mode prerenders HTML for every page, so try_files finds
    # them directly. The fallback to /index.html keeps client-side routing
    # working if you ever add it.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── ACME — also valid from HTTPS, in case ──────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # ── Quiet noise ──────────────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Block hidden files (.git, .env, .htaccess, etc.) just in case
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/family.sudoservers.com.access.log;
    error_log  /var/log/nginx/family.sudoservers.com.error.log warn;
}

# ── Notes for the Ansible role ───────────────────────────────────────────────
#
# 1. Render the Node server as a systemd unit pointing at the Astro server
#    entrypoint, something like:
#
#      [Unit]
#      Description=family.sudoservers.com Astro Node server
#      After=network.target
#
#      [Service]
#      Type=simple
#      Environment=HOST=127.0.0.1
#      Environment=PORT=4321
#      EnvironmentFile=/etc/family-sudoservers/env  # GOOGLE_CLIENT_ID, GITHUB_TOKEN, etc.
#      WorkingDirectory=/var/www/family.sudoservers.com
#      ExecStart=/usr/bin/node ./server/entry.mjs
#      Restart=on-failure
#      User=www-data
#
#      [Install]
#      WantedBy=multi-user.target
#
# 2. Deploy layout produced by `astro build` with the @astrojs/node adapter:
#      dist/
#        client/  → rsync to /var/www/family.sudoservers.com/client/
#        server/  → rsync to /var/www/family.sudoservers.com/server/
#    Then `systemctl restart family-sudoservers`.
#
# 3. /etc/family-sudoservers/env should be 0640 root:www-data and contain:
#      GOOGLE_CLIENT_ID=...
#      GITHUB_TOKEN=...
#      GITHUB_REPO=willdeberry/family.sudoservers.com
#
# 4. Make sure www-data can read /etc/letsencrypt/live/.../privkey.pem
#    indirectly via nginx (it does by default; certbot uses a hook for renew).
